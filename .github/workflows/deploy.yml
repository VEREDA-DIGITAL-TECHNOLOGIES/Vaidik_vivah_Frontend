name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy Frontend to VPS
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no root@31.97.60.154 << 'EOF'
            set -e

            cd ~/Vaidik_vivah_Frontend || exit 1

            echo "=== UPDATE CODE ==="
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            echo "=== CLEAN OLD ==="
            docker rm -f frontend-green || true

            echo "=== BUILD ==="
            docker compose -f docker-compose.green.yml build --no-cache

            echo "=== START ==="
            docker compose -f docker-compose.green.yml up -d

            echo "=== WAIT ==="
            sleep 5

            echo "=== STATUS ==="
            docker ps --format "{{.Names}}" | grep frontend-green || true

            echo "=== HEALTH ==="
            docker inspect --format='{{.State.Health.Status}}' frontend-green || echo "unknown"

            echo "=== LOGS (last 20) ==="
            docker logs frontend-green --tail 20 || true

            echo " FRONTEND DEPLOY SUCCESS"

            exit
          EOF